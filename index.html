<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 영화 보드</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>내 영화 보드</h1>
        <nav><a href="#board">영화 목록</a> <button id="theme">다크 모드</button></nav>
    </header>
    <section class="hero">
        <h2>MY MOVIE COLLECTION</h2>
        <p>내가 좋아하는 영화와 박스오피스</p>
    </section>
    <main>
        <div class="toolbar"><input id="q" type="search" placeholder="영화 제목 검색">
            <fieldset id="typeFilter">
                <legend>보기</legend><label><input type="radio" name="type" value="all" checked>전체</label><label><input
                        type="radio" name="type" value="mine">내 영화</label><label><input type="radio" name="type"
                        value="boxoffice">박스오피스</label>
            </fieldset><label for="sort">정렬</label><select id="sort">
                <option value="rating">평점순</option>
                <option value="year">최신 개봉순</option>
                <option value="title">제목 가나다순</option>
            </select>
            <p><span id="count"></span>, 찜 <span id="likeCount">0</span>편</p>
        </div>
        <section class="board" id="board"></section>
        <p class="state-empty">조건에 맞는 영화가 없습니다.</p>
        <dialog id="detail">
            <div id="detailBody"></div><button id="closeDetail">닫기</button>
        </dialog>
    </main>
    <footer>
        <p>영화 정보 및 포스터: <a href="https://www.themoviedb.org/">TMDB</a></p>
        <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
        <p>박스오피스 출처: <a href="https://www.kobis.or.kr/">영화진흥위원회 KOBIS</a> (기존 과제 자료)</p>
    </footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
